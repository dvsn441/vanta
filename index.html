<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vanta">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="icon" type="image/png" href="icon-180.png?v=4">
<link rel="manifest" href="manifest.webmanifest?v=5">
<title>Vanta</title>
<style>
/* Vanta — direction « instrument » : noir absolu, filets d'un pixel, angles droits, typographie
   Futura / DIN (natives sur iPhone). Un seul accent : le bleu du point du logo. Aucun arrondi, aucune ombre. */
:root{
  --bg:#000;
  --ink:#F2F2F0;
  --ink2:#8A8A8E;
  --ink3:#4A4A4E;
  --rule:#1C1C1F;
  --rule2:#2A2A2E;
  --press:#0E0E10;
  --blue:#0A84FF;
  --ember:#0A84FF;
  --alert:#FF3B30;
  --out:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.2,.8,.2,1);
  --gut:20px;
  --f-disp:"Futura","Century Gothic","Avenir Next",sans-serif;
  --f-text:"Avenir Next","Avenir","Segoe UI",sans-serif;
  --f-num:"DIN Alternate","DIN Condensed","Bahnschrift","Avenir Next",sans-serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none;overflow:hidden}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{position:fixed;inset:0;font:15px/1.35 var(--f-text);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;touch-action:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus{outline:none}
button:focus-visible{outline:1px solid var(--blue);outline-offset:-1px}
svg{display:block}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter;flex:none}
.cap{font-family:var(--f-disp);font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase}

/* ------------------------------------------------------------- bandeau d'etat */
.status{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:var(--gut);right:var(--gut);z-index:4;
  display:flex;align-items:center;gap:10px;padding:10px 12px;background:#000;border:1px solid var(--rule2);
  font-family:var(--f-disp);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;
  opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .15s var(--out),transform .15s var(--out)}
.status.on{opacity:1;transform:none}
.status .ico{width:14px;height:14px;color:var(--ink2)}
.status.bad{border-color:var(--alert)}
.status.bad .ico{color:var(--alert)}
.spin{animation:spin 1.2s linear infinite}
/* un autre telephone pilote ce PC : bandeau avec « Prendre la main » */
.held{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:var(--gut);right:var(--gut);z-index:5;
  display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;background:#000;border:1px solid var(--blue);
  font-family:var(--f-disp);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.held span{flex:1;line-height:1.5}
.held button{flex:none;padding:9px 12px;background:var(--blue);color:#fff;font-family:var(--f-disp);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.held.hidden{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ------------------------------------------------------------- vues */
.views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .14s linear}
.view.on{opacity:1;pointer-events:auto}

/* ------------------------------------------------------------- surface tactile */
.pad{position:relative;overflow:hidden;touch-action:none;background:#000;margin:12px var(--gut) 0;border:1px solid var(--rule)}
/* reperes d'angle, comme sur un viseur */
.pad::before{content:"";position:absolute;inset:14px;pointer-events:none;
  background:
    linear-gradient(var(--ink3),var(--ink3)) 0 0/14px 1px no-repeat,linear-gradient(var(--ink3),var(--ink3)) 0 0/1px 14px no-repeat,
    linear-gradient(var(--ink3),var(--ink3)) 100% 0/14px 1px no-repeat,linear-gradient(var(--ink3),var(--ink3)) 100% 0/1px 14px no-repeat,
    linear-gradient(var(--ink3),var(--ink3)) 0 100%/14px 1px no-repeat,linear-gradient(var(--ink3),var(--ink3)) 0 100%/1px 14px no-repeat,
    linear-gradient(var(--ink3),var(--ink3)) 100% 100%/14px 1px no-repeat,linear-gradient(var(--ink3),var(--ink3)) 100% 100%/1px 14px no-repeat}
.pad::after{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid var(--blue);opacity:0;transition:opacity .12s linear}
.pad.drag::after{opacity:1}
#pad{flex:1}
.bloom{display:none}

/* point de contact : le point bleu du logo, avec un reticule qui traverse la surface */
.halo{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--blue);
  pointer-events:none;opacity:0;transition:opacity .25s linear;will-change:transform,opacity}
.halo::before,.halo::after{content:"";position:absolute;background:rgba(242,242,240,.10)}
.halo::before{left:-200vw;right:-200vw;top:4.5px;height:1px}
.halo::after{top:-200vh;bottom:-200vh;left:4.5px;width:1px}
.halo.on{opacity:1;transition:opacity .06s linear}
.pad.drag .halo{background:var(--ink)}
.pad.drag .halo::before,.pad.drag .halo::after{background:rgba(10,132,255,.45)}

.tap{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border:1px solid var(--blue);pointer-events:none;animation:tap .3s var(--out) forwards}
.tap.r{border-color:var(--ink)}
@keyframes tap{from{transform:scale(.5);opacity:1}to{transform:scale(1.4);opacity:0}}

.rail{position:absolute;right:14px;top:50%;width:1px;height:140px;margin-top:-70px;background:var(--rule2);opacity:0;transition:opacity .2s linear;pointer-events:none}
.rail i{position:absolute;left:-1px;right:-1px;top:50%;height:28px;margin-top:-14px;background:var(--blue);transition:transform .2s var(--out)}
.rail.on{opacity:1;transition:none}
.rail.on i{transition:none}

.badge{position:absolute;top:14px;left:50%;display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--blue);color:#fff;
  font-family:var(--f-disp);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  transform:translate(-50%,-4px);opacity:0;transition:opacity .12s linear,transform .12s var(--out);pointer-events:none}
.badge .ico{width:13px;height:13px}
.pad.drag .badge{opacity:1;transform:translate(-50%,0)}

/* mode d'emploi : une legende technique, pas des bulles */
.hint{position:absolute;left:28px;right:28px;bottom:30px;display:flex;flex-direction:column;gap:9px;pointer-events:none;transition:opacity .3s linear}
.hint.gone{opacity:0}
.hint p{display:block;position:relative;padding-left:30px;font-family:var(--f-disp);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.hint p b{position:absolute;left:0;top:0;font:500 10px var(--f-num);letter-spacing:.06em;color:var(--blue)}
.hint p span{margin-left:.6em;color:var(--ink3)}

/* ------------------------------------------------------------- clavier */
#vMain{gap:0}
.kbd-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink3);pointer-events:none;transition:opacity .2s linear;
  font-family:var(--f-disp);font-size:10px;letter-spacing:.22em;text-transform:uppercase}
.kbd-hint .ico{display:none}
.acc{flex:none;display:flex;flex-direction:column;margin:0 var(--gut)}
.line{display:flex;height:56px;border-bottom:1px solid var(--rule)}
.field{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:0 4px}
.field .ico{display:none}
.field::before{content:"›";font:400 22px var(--f-disp);color:var(--ink3);margin-top:-2px}
.kb .field::before{color:var(--blue)}
.field .txt{flex:1;min-width:0;font:400 19px var(--f-text);white-space:pre;overflow:hidden}
.field .ph{font-family:var(--f-disp);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);vertical-align:3px}
.caret{display:none;width:1px;height:21px;margin-left:1px;vertical-align:-4px;background:var(--blue);animation:blink 1s steps(1) infinite}
.kb .caret{display:inline-block}
@keyframes blink{50%{opacity:0}}
#typer{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0 16px;border:0;resize:none;overflow:hidden;opacity:.011;
  font:16px/56px -apple-system,system-ui,sans-serif;background:none;color:transparent;caret-color:transparent;-webkit-user-select:text;user-select:text;outline:none}
.kbhide{display:none;flex:none;width:56px;align-items:center;justify-content:center;color:var(--ink2);border-left:1px solid var(--rule)}
.kb .kbhide{display:flex}
.keys{display:grid;grid-template-columns:repeat(8,1fr)}
.key{position:relative;height:52px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  font-family:var(--f-disp);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);transition:background .1s linear}
.key:last-child{border-right:0}
.key .ico{width:17px;height:17px}
.key.press,.kbhide.press{background:var(--press);color:var(--blue);transition:none}
.kb{padding-bottom:6px}
.kb .dock{display:none}
.short .acc{flex-direction:row}
.short .line{flex:1;min-width:0;height:48px;border-bottom:0;border-right:1px solid var(--rule)}
.short .keys{flex:none;width:min(440px,56%)}
.short .key{height:48px;border-bottom:0}

/* ------------------------------------------------------------- barre basse */
.dock{flex:none;display:flex;align-items:stretch;height:58px;margin:0 var(--gut);border-top:1px solid var(--rule)}
.pcbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:0 18px 0 2px;
  font-family:var(--f-disp);font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:color .12s linear}
.pcbtn:active{color:var(--ink2)}
.pcbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcbtn .ico{width:11px;height:11px;color:var(--ink3);stroke-width:1.8}
/* qualite de la liaison, mesuree en continu : FLUIDE / CORRECT / INSTABLE */
.qual{margin-left:auto;font-size:9px;letter-spacing:.18em;color:var(--ink3);white-space:nowrap;transition:color .3s}
.qual.a{color:var(--blue)}.qual.b{color:var(--ink2)}.qual.c{color:#FF9F0A}
.led{width:6px;height:6px;border-radius:50%;flex:none;background:var(--ink3);transition:background .3s}
.led.ok{background:var(--blue)}
.led.wait{animation:pulse 1.2s ease-in-out infinite}
.led.bad{background:var(--alert)}
@keyframes pulse{50%{opacity:.2}}
.devbtn{flex:none;padding:0 2px 0 18px;border-left:1px solid var(--rule);color:var(--ink2);
  font-family:var(--f-disp);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;transition:color .12s linear}
.devbtn:active{color:var(--blue)}
.seg{flex:1;position:relative;display:grid;grid-template-columns:1fr 1fr}
.seg .thumb{position:absolute;top:-1px;left:0;width:50%;height:2px;background:var(--blue);transition:transform .22s var(--out)}
.seg.right .thumb{transform:translateX(100%)}
.seg button{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;color:var(--ink3);
  font-family:var(--f-disp);font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:color .12s linear}
.seg button[aria-selected="true"]{color:var(--ink)}
.seg .ico{display:none}

/* ------------------------------------------------------------- choix de l'ordinateur */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .18s linear;z-index:6}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:7;left:0;right:0;bottom:0;padding:0 var(--gut) calc(env(safe-area-inset-bottom) + 8px);background:#000;border-top:1px solid var(--rule2);
  display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s var(--out)}
.sheet.on{transform:none;transition:transform .32s var(--out)}
.group{display:flex;flex-direction:column}
.group h2{padding:22px 2px 12px;font-family:var(--f-disp);font-size:10px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--ink3)}
.row{width:100%;display:flex;align-items:center;gap:14px;padding:0 2px;height:58px;text-align:left;border-top:1px solid var(--rule);
  font-family:var(--f-disp);font-size:13px;letter-spacing:.14em;text-transform:uppercase;transition:background .1s linear}
.row:active{background:var(--press)}
.row .grow{flex:1}
.row .ico{color:var(--ink3);width:16px;height:16px}
.row .check{color:var(--blue)}
.row.warn,.row.warn .ico{color:var(--alert)}
.row.center{justify-content:center;color:var(--ink2);border-bottom:1px solid var(--rule)}

/* ------------------------------------------------------------- ecran de code */
.lock{position:fixed;inset:0;z-index:10;background:#000;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 22px) calc(env(safe-area-inset-right) + var(--gut)) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + var(--gut));
  transition:opacity .25s linear}
.lock.hidden{opacity:0;pointer-events:none}
.lock-head{flex:1;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:0}
.brand{display:flex;align-items:center;gap:12px;width:100%;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.mark{width:26px;height:26px}
.lock h1{font:500 12px var(--f-disp);letter-spacing:.42em;text-transform:uppercase}
.brand .cap{margin-left:auto;color:var(--ink3)}
.lock-title{margin-top:auto;font:500 10.5px var(--f-disp);letter-spacing:.24em;text-transform:uppercase;color:var(--ink3)}
.lock p{margin-top:10px;font:400 21px/1.25 var(--f-text);color:var(--ink);max-width:300px;min-height:52px;transition:color .2s}
.lock p.err{color:var(--alert)}
.dots{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;width:100%;margin:26px 0 26px}
.dots i{height:2px;background:var(--rule2);transition:background .12s linear,height .12s linear}
.dots i.f{background:var(--blue);height:4px}
.dots.err i{background:var(--alert)}
.dots.shake{animation:shake .4s var(--out)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}45%{transform:translateX(8px)}70%{transform:translateX(-4px)}}
.lock-body{width:100%}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule)}
.num{height:var(--k,74px);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--rule);
  font:400 34px var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink);transition:background .12s linear,color .12s linear}
.num:nth-child(3n+2){border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.num.press{background:var(--press);color:var(--blue);transition:none}
.num.ghost{color:var(--ink2)}
.num.ghost .ico{width:22px;height:22px}
.num.blank{visibility:visible;cursor:default}
.lock-pc{align-self:flex-start;margin-top:16px;display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--ink2);
  font-family:var(--f-disp);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;transition:color .12s linear}
.lock-pc:active{color:var(--blue)}
.lock-pc .ico{width:13px;height:13px}
.lock-pc[hidden]{display:none}
.scan{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.scan.hidden{display:none}
.scan video{width:100%;max-width:420px;aspect-ratio:1;object-fit:cover;border:1px solid var(--blue)}
.scan p{font:400 17px/1.3 var(--f-text);color:var(--ink);text-align:center;max-width:300px}
.scan .lock-pc{align-self:center}

/* ------------------------------------------------------------- tailles */
@media (min-width:700px){
  :root{--gut:32px}
  .lock-head,.lock-body,.lock-pc{width:100%;max-width:460px;margin-left:auto;margin-right:auto}
  .lock-pc{align-self:center}
  .dock{max-width:620px;margin-left:auto;margin-right:auto;width:100%}
  .acc{max-width:720px;margin-left:auto;margin-right:auto;width:100%}
}
@media (orientation:landscape) and (max-height:520px){
  .dock{height:46px}
  .lock{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
  .lock-head{grid-column:1}
  .lock-body{grid-column:2;grid-row:1 / 3;align-self:center}
  .lock-pc{grid-column:1}
  .num{--k:52px;font-size:26px}
  .hint{bottom:16px;gap:6px}
}
@media (max-height:700px) and (orientation:portrait){
  .num{--k:62px;font-size:30px}
  .lock p{font-size:18px;min-height:46px}
  .dots{margin:18px 0}
}
@media (prefers-reduced-motion:reduce){
  .status,.status.on,.badge,.pad.drag .badge{transform:none}
  .sheet{transform:none;opacity:0;pointer-events:none;transition:opacity .18s linear}
  .sheet.on{opacity:1;pointer-events:auto}
  .seg .thumb,.rail i{transition:none}
  .dots.shake,.spin{animation:none}
  .tap{animation-name:fade}
  @keyframes fade{from{opacity:1}to{opacity:0}}
}

/* ------------------------------------------------------------- prise en main (premiere ouverture) */
.intro{position:fixed;inset:0;z-index:12;background:#000;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 22px) calc(env(safe-area-inset-right) + var(--gut)) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + var(--gut));
  transition:opacity .3s linear}
.intro.hidden{opacity:0;pointer-events:none}
/* Sinon la diapo active (pointer-events:auto) reste cliquable par-dessus le pave du code. */
.intro.hidden *,.lock.hidden *{pointer-events:none!important}
.intro .brand{flex:none}
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.prog i{height:2px;background:var(--rule2);transition:background .2s linear}
.prog i.on{background:var(--blue)}
.slides{flex:1;position:relative;min-height:0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;transform:translateX(18px);pointer-events:none;transition:opacity .25s linear,transform .3s var(--out)}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.slide.past{transform:translateX(-18px)}
.slide .idx{font:400 13px var(--f-num);letter-spacing:.08em;color:var(--blue)}
.slide h2{margin:12px 0 0;font:400 30px/1.12 var(--f-disp);letter-spacing:-.01em;max-width:13em}
.slide p{margin:14px 0 0;font:400 17px/1.45 var(--f-text);color:var(--ink2);max-width:24em}
.slide p b{color:var(--ink);font-weight:500}
.art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.art svg{max-width:100%;max-height:100%}
.share{display:inline-block;width:15px;height:18px;vertical-align:-3px;margin:0 2px}
.lock-art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:18px 0}
.lock-art svg{width:min(100%,300px);height:auto;max-height:100%}
.lock-title{margin-top:0!important}
.steps-i{list-style:none;margin:16px 0 0;padding:0;counter-reset:s;display:grid;gap:12px}
.steps-i li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;font:400 16.5px/1.4 var(--f-text);color:var(--ink2)}
.steps-i li::before{content:counter(s);font:500 17px var(--f-num);color:var(--blue)}
.steps-i li b{color:var(--ink);font-weight:500}
.steps-i li.last{color:var(--ink)}
.intro-foot{flex:none;display:flex;align-items:center;gap:16px;margin-top:26px;padding-top:16px;border-top:1px solid var(--rule)}
.intro-foot .skip{color:var(--ink3);font-family:var(--f-disp);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;padding:8px 0}
.intro-foot .next{margin-left:auto;height:52px;padding:0 26px;background:var(--ink);color:#000;font-family:var(--f-disp);font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;transition:background .12s linear,color .12s linear}
.intro-foot .next:active{background:var(--blue);color:#fff}
@media (max-height:700px){.slide h2{font-size:25px}.slide p{font-size:15.5px}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const store = {
  get(k, d){ try{ const v = localStorage.getItem('jr.' + k); return v === null ? d : JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem('jr.' + k, JSON.stringify(v)) }catch(e){} }
};
const tick = () => navigator.vibrate && navigator.vibrate(6);
const icon = id => `<svg class="ico"><use href="#${id}"/></svg>`;
// Pas de zoom ni de geste systeme parasite (Safari ignore user-scalable).
['gesturestart','gesturechange','dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e => { if (!e.target.closest('.pad')) e.preventDefault(); }, {passive:false});

// ---------- Ordinateurs
const here = location.origin.startsWith('http') ? location.origin : 'http://localhost:8765';
// En HTTPS (adresse Tailscale), l'appli reste en cache sur l'iPhone : elle s'ouvre meme si ce PC est eteint.
const secure = location.protocol === 'https:';
// Ouverte depuis le site public (QR code) et non servie par un PC : tout passe par le relais Internet.
const HOSTED = /\.github\.io$/.test(location.hostname);
// Appareils : rien n'est ecrit en dur. Chaque telephone garde sa propre liste ; au depart elle contient
// l'ordinateur qui sert la page, plus ceux que cet ordinateur declare dans son config.json ("peers").
const DEV_KEY = secure ? 'devices' : 'devices-local';
const clean = u => u.trim().replace(/\/+$/, '');
let pcs = store.get(DEV_KEY, null) || store.get(secure ? 'pcs-https' : 'pcs', null);
if (HOSTED) pcs = (pcs || []).filter(p => p.key);  // sur le site public, seuls les PC du relais ont un sens
if (!pcs || !pcs.length) pcs = HOSTED ? [] : [{name: location.hostname.split('.')[0] || 'Cet ordinateur', url: here}];
// QR code de Vanta : https://.../vanta/#k=<cle du PC>&n=<nom>&l=<adresse Wi-Fi de secours>
const qr = new URLSearchParams(location.hash.slice(1));
if (qr.get('k') && window.crypto && crypto.subtle) {
  // f = empreinte de l'identite du PC : seul le vrai PC peut ouvrir une session avec ce telephone
  const k = qr.get('k'), fp = qr.get('f') || '', name = qr.get('n') || 'Ordinateur', lan = qr.get('l') || '';
  // b = serveurs relais du PC, seulement s'ils sont changes dans son config.json (tests, relais a soi)
  const brokers = (qr.get('b') || '').split(' ').filter(u => /^wss?:\/\//.test(u));
  // Meme PC reinstalle (nouvelle cle) : l'ancienne entree ne repondra plus jamais, on la remplace.
  pcs = pcs.filter(p => !(p.key && p.key !== k && p.name === name));
  const m = pcs.find(p => p.key === k);
  if (m) { m.name = name; m.lan = lan; m.brokers = brokers; m.fp = fp; } else pcs.push({name, key: k, fp, lan, brokers, url: 'relay:' + k.slice(0, 12)});
  store.set('cur', pcs.findIndex(p => p.key === k));
  // Icone d'ecran d'accueil : elle rouvre ce lien complet (avec la cle), pas la page nue.
  try {
    const abs = f => new URL(f, location.href).href;
    const man = {name: 'Vanta', short_name: 'Vanta', start_url: location.href, display: 'standalone', background_color: '#000000', theme_color: '#000000',
      icons: [{src: abs('icon-180.png'), sizes: '180x180', type: 'image/png'}, {src: abs('icon-512.png'), sizes: '512x512', type: 'image/png'}]};
    document.querySelector('link[rel=manifest]').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man));
  } catch(e){}
}
if (!pcs.length) pcs = [{name: 'Aucun PC', url: 'none:', none: true}];  // rien a piloter tant que le QR n'est pas scanne
const saveDevices = () => store.set(DEV_KEY, pcs.filter(p => !p.none));
saveDevices();
function addDevice(name, url){
  url = clean(url); if (!/^https?:\/\//.test(url)) return false;
  const m = pcs.find(p => clean(p.url) === url || p.name.toLowerCase() === name.toLowerCase());
  if (m) { m.url = url; if (name) m.name = name; } else pcs.push({name: name || new URL(url).hostname.split('.')[0], url});
  saveDevices(); return true;
}
if (secure && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (!HOSTED) fetch(here + '/api/ping').then(r => r.json()).then(({name, peers}) => {
  const self = pcs.find(p => clean(p.url) === clean(here)) || pcs.find(p => p.name.toLowerCase() === (name || '').toLowerCase());
  if (self) { self.url = here; if (name) self.name = name; } else addDevice(name, here);
  (peers || []).forEach(p => { if (p && p.url && clean(p.url) !== clean(here) && !(secure && !/^https:/.test(p.url))) addDevice(p.name || '', p.url); });
  saveDevices(); renderPc();
}).catch(() => {});
let cur = Math.min(store.get('cur', 0), pcs.length - 1);
const pc = () => pcs[cur];
// Un code par ordinateur : le code tape choisit le PC a piloter.
// Appairage : le jeton survit 5 min hors de l'appli (aller sur une autre appli, l'iPhone qui la recharge...).
// Au-dela, un nouveau code est demande.
const AWAY_MAX = 5 * 60 * 1000;
const sess = store.get('sess', null);
const fresh = sess && Date.now() - sess.at < AWAY_MAX;
const pins = fresh ? (sess.pins || {}) : {};
if (fresh && typeof sess.cur === 'number' && sess.cur < pcs.length) cur = sess.cur;
let pin = pins[pc().name] || '';
const keepSess = () => store.set('sess', Object.keys(pins).length ? {pins, cur, at: Date.now()} : null);
function savePin(p){ pin = p; if (p) pins[pc().name] = p; else delete pins[pc().name]; keepSess(); }
setInterval(() => { if (!document.hidden && pin) keepSess(); }, 20000);
addEventListener('pagehide', keepSess);
try { localStorage.removeItem('jr.pins'); localStorage.removeItem('jr.pin'); } catch(e){}
const post = (url, body, ms = 4000) => {
  const ctl = new AbortController(); setTimeout(() => ctl.abort(), ms);
  return fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {}), signal: ctl.signal});
};
// Demande a chaque PC allume d'afficher un nouveau code sur son ecran.
// On retient les PC qui ont repondu : un PC eteint ne fait pas attendre la verification du code.
let live = null;
function startPairing(){
  const seen = new Set(); live = null;
  pcs.forEach((p, i) => {
    if (p.none) return;
    if (p.key) return relayOf(p).request({t: 'pair_start'}, 'pair', 8000).then(r => { if (r) { seen.add(i); live = seen; } });
    post(p.url + '/api/pair/start').then(r => { if (r.ok) { seen.add(i); live = seen; } }).catch(() => {});
  });
}
function cancelPairing(except){
  pcs.forEach((p, i) => {
    if (i === except || p.none) return;
    if (p.key) { if (relayOf(p).ok) relayOf(p).send({t: 'pair_cancel'}); return; }
    post(p.url + '/api/pair/cancel').catch(() => {});
  });
}
// Verification du code par le relais : meme reponse que /api/pair/confirm ({status, token}).
function relayConfirm(p, code){
  return relayOf(p).request({t: 'pair_confirm', code}, 'pair_result', 8000)
    .then(r => { if (r && r.cum) relayOf(p).cum = true;
      return !r ? {status: 0} : r.token ? {status: 200, token: r.token} : {status: r.status || 401}; });
}

// ---------- Relais Internet : quand le telephone n'est pas sur le reseau du PC
// Le PC et le telephone se retrouvent sur un serveur MQTT public. Tout est chiffre et signe avec la
// cle du QR code : le serveur ne peut ni lire ni envoyer d'ordres. Memes serveurs que relay.py (BROKERS).
const BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt', 'wss://mqtt.eclipseprojects.io/mqtt'];
const te = new TextEncoder(), td = new TextDecoder();
const cat = (a, b) => { const o = new Uint8Array(a.length + b.length); o.set(a); o.set(b, a.length); return o; };
const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
const b64u = b => btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
// MQTT 3.1.1 reduit au strict necessaire : connexion, abonnement, publication, ping.
const mq = {
  len(n){ const o = []; do { let b = n % 128; n = Math.floor(n / 128); if (n) b |= 128; o.push(b); } while (n); return o; },
  str(s){ const b = te.encode(s); return [b.length >> 8, b.length & 255, ...b]; },
  pkt(type, body){ return new Uint8Array([type, ...mq.len(body.length), ...body]); },
  connect(id){ return mq.pkt(0x10, [...mq.str('MQTT'), 4, 2, 0, 30, ...mq.str(id)]); },
  subscribe(topic){ return mq.pkt(0x82, [0, 1, ...mq.str(topic), 0]); },
  publish(topic, data){ return mq.pkt(0x30, [...mq.str(topic), ...data]); },
  ping: new Uint8Array([0xC0, 0]),
  // Un paquet complet en tete du tampon, ou null s'il n'est pas encore arrive en entier.
  parse(buf){
    let n = 0, mul = 1, i = 1, b;
    do { if (i >= buf.length) return null; b = buf[i++]; n += (b & 127) * mul; mul *= 128; } while (b & 128);
    if (buf.length < i + n) return null;
    return {type: buf[0] >> 4, flags: buf[0] & 15, body: buf.subarray(i, i + n), size: i + n};
  },
};
// Chiffre + signe, exactement comme relay.py (classe Box) : HMAC-SHA256 en mode compteur, puis
// signature HMAC-SHA256 sur 32 octets. Format : nonce (12) + chiffre + signature (32).
const Box = {
  async make(raw){
    const imp = b => crypto.subtle.importKey('raw', b, {name: 'HMAC', hash: 'SHA-256'}, false, ['sign']);
    const base = await imp(raw), sub = async l => imp(new Uint8Array(await crypto.subtle.sign('HMAC', base, te.encode(l))));
    const ke = await sub('vanta-enc'), km = await sub('vanta-mac');
    const mac = async (k, data) => new Uint8Array(await crypto.subtle.sign('HMAC', k, data));
    const xor = async (sens, nonce, data) => {
      const pre = cat(te.encode(sens), nonce), blocks = [];
      for (let i = 0; i * 32 < data.length; i++) { const c = new Uint8Array(4); new DataView(c.buffer).setUint32(0, i); blocks.push(mac(ke, cat(pre, c))); }
      const ks = await Promise.all(blocks), out = new Uint8Array(data.length);
      for (let j = 0; j < data.length; j++) out[j] = data[j] ^ ks[j >> 5][j & 31];
      return out;
    };
    return {
      async seal(sens, nonce, plain){ const ct = await xor(sens, nonce, plain); return cat(cat(nonce, ct), await mac(km, cat(cat(te.encode(sens), nonce), ct))); },
      async open(sens, data){
        if (data.length <= 44) return null;
        const nonce = data.slice(0, 12), ct = data.slice(12, -32), tag = data.slice(-32);
        const want = await mac(km, cat(cat(te.encode(sens), nonce), ct));
        let d = 0; for (let j = 0; j < 32; j++) d |= want[j] ^ tag[j];
        return d ? null : xor(sens, nonce, ct);
      },
    };
  },
};
// Echange de cles Diffie-Hellman (groupe 14 de la RFC 3526, 2048 bits), le meme que relay.py (DH_P).
// La cle du QR sert seulement a se presenter ; ensuite chaque telephone a SA cle de session, que les
// autres porteurs du QR ne connaissent pas : ils ne peuvent lire ni le code, ni le jeton, ni la frappe.
const DH_P = BigInt('0x' +

// ---------- Etat de connexion

  const st = $('#status'), txt = $('#statusTxt'), ico = $('#statusIco');

            : s === 'settle' ? ['i-sync', 'Connexion en cours… la souris peut hésiter un instant', false]
            : s === 'good' ? ['i-ok', 'Connecté · tout fonctionne', false]
            : s === 'slow' ? ['i-sync', 'Internet lent · la souris peut saccader', true]
            : s === 'bad' ? ['i-sync', pc().name + ' hors ligne · nouvel essai…', true]

const artCode = '<svg viewBox="0 0 260 200"><rect x="10" y="20" width="240" height="150" fill="none" stroke="#2A2A2E"/><rect x="18" y="28" width="96" height="40" fill="#0B0B0D" stroke="#0A84FF"/><text x="26" y="41" fill="#8A8A8E" font-size="7" letter-spacing="1.5" font-family="Futura, Century Gothic, sans-serif">CODE VANTA</text><text x="26" y="61" fill="#F2F2F0" font-size="17" font-family="DIN Alternate, Bahnschrift, sans-serif">482 917</text></svg>';
const artDone = '<svg viewBox="0 0 260 200"><circle cx="130" cy="100" r="62" fill="none" stroke="#2A2A2E"/><circle cx="130" cy="100" r="40" fill="none" stroke="#2A2A2E"/><path d="M130 38v16M130 146v16M68 100h16M176 100h16" stroke="#2A2A2E"/><circle cx="130" cy="100" r="7" fill="#0A84FF"/></svg>';
const installSteps = isIOS
  ? '<li><span>Touche ' + shareIco + ' <b>Partager</b>, en bas de Safari (ou <b>•••</b> puis <b>Partager</b>).</span></li>'
  + '<li><span>Choisis <b>Sur l\'écran d\'accueil</b> (fais défiler la liste si besoin).</span></li>'
  + '<li><span>Touche <b>Ajouter</b>.</span></li>'
  + '<li class="last"><span><b>Ferme Safari et ouvre l\'icône Vanta</b> sur ton écran d\'accueil. La suite se passe là-bas.</span></li>'
  :'<li><span>Touche <b>⋮</b>, en haut à droite de Chrome.</span></li>'
  + '<li><span>Choisis <b>Ajouter à l\'écran d\'accueil</b> ou <b>Installer l\'application</b>.</span></li>'
  + '<li class="last"><span><b>Ferme Chrome et ouvre l\'icône Vanta</b> sur ton écran d\'accueil. La suite se passe là-bas.</span></li>';
const FLOWS = {
  web: [
    {art: artDuo, h: 'Ton téléphone devient ta souris.',
     p: 'Vanta transforme ton téléphone en pavé tactile et en clavier pour ton ordinateur. Il ne reste qu\'à l\'installer sur ton téléphone : trente secondes, rien à télécharger.'},
    {art: artCode, h: 'Le principe : un code, et c\'est tout.',
     p: 'Vanta tourne déjà sur ton ordinateur, même fenêtre fermée. Chaque fois que tu ouvres l\'appli, un code à six chiffres apparaît <b>en haut à gauche de l\'écran de l\'ordinateur</b>. Tu le tapes, tu pilotes.'},
    {h: 'Ajoute Vanta à ton écran d\'accueil.',
     p: 'Vanta y devient une icône, comme une vraie appli. C\'est depuis cette icône que tu l\'ouvriras à chaque fois.',
     list: installSteps, final: true},
  ],
  app: [
    {art: artDone, h: 'Vanta est installé.',
     p: 'À l\'écran suivant, un code à six chiffres va s\'afficher <b>en haut à gauche de l\'écran de ton ordinateur</b>. Tape-le. Ce sera pareil à chaque fois : ouvre Vanta, tape le code, pilote.',
     cta: 'Taper le code'},
  ],
};
// Icone ouverte sans la cle du PC (rien a piloter) : on fait scanner le QR code au lieu de promettre un code.
if (pc().none && HOSTED) FLOWS.app = [{art: artDone, h: 'Vanta est installé.',
  p: 'Dernière étape : scanne ici le <b>QR code affiché par Vanta sur ton ordinateur</b>. Ensuite, tape le code qui apparaît en haut à gauche de son écran.',
  cta: 'Scanner le QR code', scan: true}];
const flow = standalone ? 'app' : 'web';
// Sur le site public aussi, on guide jusqu'a l'icone d'ecran d'accueil (elle rouvre le lien avec la cle).
const S = FLOWS[flow];
$('#introTag').textContent = standalone ? 'Installé' : 'Bienvenue';
$('#prog').innerHTML = S.length > 1 ? S.map(() => '<i></i>').join('') : '';
$('#prog').style.gridTemplateColumns = 'repeat(' + S.length + ',1fr)';
$('#slides').innerHTML = S.map((s, i) => '<section class="slide">'
  + (s.art ? '<div class="art">' + s.art + '</div>' : '<div class="art"></div>')
  + (S.length > 1 ? '<div class="idx">0' + (i + 1) + ' / 0' + S.length + '</div>' : '')
  + '<h2>' + s.h + '</h2>'
  + (s.p ? '<p>' + s.p + '</p>' : '')
  + (s.list ? '<ol class="steps-i">' + s.list + '</ol>' : '')
  + '</section>').join('');
let slide = 0;
function paintIntro(){
  $$('#slides .slide').forEach((s, i) => { s.classList.toggle('on', i === slide); s.classList.toggle('past', i < slide); });
  $$('#prog i').forEach((b, i) => b.classList.toggle('on', i <= slide));
  const cur = S[slide];
  // Derniere etape dans le navigateur : pas de bouton « Commencer », l'action se fait dans Safari.
  $('#introNext').hidden = !!cur.final;
  $('#introNext').textContent = cur.cta || (slide === S.length - 1 ? 'Commencer' : 'Suivant');
  $('#introSkip').textContent = cur.final ? 'Continuer sans installer' : 'Passer';
  $('#introSkip').style.visibility = (flow === 'app') ? 'hidden' : 'visible';
}
const doneKey = flow === 'app' ? 'appWelcomed' : 'introDone';
function closeIntro(){ store.set(doneKey, true); $('#intro').classList.add('hidden'); if (!pin) showLock(); }
$('#introNext').onclick = () => { tick(); if (slide < S.length - 1) { slide++; paintIntro(); } else { closeIntro(); if (S[slide].scan) startScan(); } };
// « Passer » saute les explications, jamais l'etape de l'ecran d'accueil.
$('#introSkip').onclick = () => {
  if (flow === 'web' && !S[slide].final) { slide = S.length - 1; paintIntro(); return; }
  if (flow === 'web') { try { sessionStorage.setItem('skipInstall', '1'); } catch (e) {} }
  closeIntro();
};
let sx = 0;
$('#slides').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, {passive:true});
$('#slides').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (dx < -50 && slide < S.length - 1) { slide++; paintIntro(); } else if (dx > 50 && slide > 0) { slide--; paintIntro(); }
}, {passive:true});
// Dans le navigateur, la prise en main revient tant que l'icone n'est pas installee (sauf si on a choisi de continuer).
// Explications deja vues : on revient directement a l'etape de l'ecran d'accueil.
// Arrivee par « Mode direct » : chaque adresse a sa propre memoire, celle-ci n'a jamais vu la prise en main.
// On la marque comme vue et on va droit au code.
const dq = new URLSearchParams(location.hash.slice(1)), directTicket = (!HOSTED && dq.has('direct') && dq.get('t')) || '';
if (dq.has('direct')) {
  store.set(doneKey, true); try { sessionStorage.setItem('skipInstall', '1'); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
}
let skipInstall = false; try { skipInstall = sessionStorage.getItem('skipInstall') === '1'; } catch (e) {}
if (!store.get(doneKey, false)) { paintIntro(); $('#intro').classList.remove('hidden'); }
else if (flow === 'web' && !skipInstall) {
  // Seule l'etape de l'icone revient : pas de barre ni de « 03 / 03 », qui feraient croire a un parcours.
  slide = S.length - 1; paintIntro();
  $('#prog').style.visibility = 'hidden'; $$('#slides .idx').forEach(e => e.remove());
  $('#intro').classList.remove('hidden');
}

renderPc();
if (directTicket) {
  // Arrivee par « Mode direct » avec un ticket : on pilote CE PC tout de suite, sans code.
  if (!pcs.some(p => clean(p.url) === clean(here))) addDevice('', here);
  cur = Math.max(0, pcs.findIndex(p => clean(p.url) === clean(here))); store.set('cur', cur); renderPc();
  post(here + '/api/pair/ticket', {ticket: directTicket}).then(r => r.ok ? r.json() : null).catch(() => null)
    .then(j => { if (j && j.token) { savePin(j.token); connect(); } else showLock('Tape le code affiché en haut à gauche de l’écran de ton ordinateur.'); });
}
// Le code n'est demande a l'ordinateur qu'une fois la prise en main terminee, pour qu'il n'expire pas pendant la lecture.
else if (pin) connect(); else if ($('#intro').classList.contains('hidden')) showLock();
</script>
</body>
</html>
